name: Atualizar feed RSS

"on":
  schedule:
    # Atualiza uma vez por hora, fora do minuto cheio para reduzir atrasos.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar-feed:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Buscar todas as páginas e gerar o RSS
        run: |
          mkdir -p docs
          python3 zine_agenda_rss.py --output docs/feed.xml

      - name: Empacotar feed para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
